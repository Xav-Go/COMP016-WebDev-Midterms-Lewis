<style>
:root{--desk:#2c3836;--folder:#d6ad52;--folder-lo:#c39a3f;--edge:#9c7a2c;--tabink:#2b1f06;--paper:#fcfaf4;--ink:#262219;--muted:#6f6858;--rule:#ddd5c0;--accent:#1f5b78;--s1:#ebe5d3;--s2:#ddd6c0;--bar:#e9efe9;--barm:#a9b8b2;--focus:#4a9be0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#161c1b;--folder:#b38f3e;--folder-lo:#9d7b31;--edge:#6f561d;--paper:#211f1a;--ink:#ece6d6;--muted:#a39b86;--rule:#3a3629;--accent:#7cc0de;--s1:#2a2721;--s2:#33302a;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#161c1b;--folder:#b38f3e;--folder-lo:#9d7b31;--edge:#6f561d;--paper:#211f1a;--ink:#ece6d6;--muted:#a39b86;--rule:#3a3629;--accent:#7cc0de;--s1:#2a2721;--s2:#33302a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--bar);font:16px/1.55 'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;padding:20px 16px 48px}
.wrap{max-width:940px;margin:0 auto}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.bar p{margin:0;color:var(--barm);font-size:14px}
.bar div{display:flex;gap:8px}
.b{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--barm);background:transparent;color:var(--bar);padding:7px 14px;border-radius:999px;cursor:pointer}
.b:hover{background:rgba(255,255,255,.1)}
.b.on{background:var(--bar);color:var(--desk)}
.tabs{display:flex;align-items:flex-end;overflow-x:auto;padding:0;margin-bottom:-1px;position:relative;z-index:2;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;isolation:isolate;flex:none;font:inherit;font-size:15px;font-weight:500;color:var(--t);background:none;border:0;padding:calc(9px + var(--i)*3px) 46px 9px 36px;margin-left:-30px;cursor:pointer;white-space:nowrap}
.tab:first-child{margin-left:0;padding-left:24px}
.tab::before,.tab::after{content:"";position:absolute;top:0;bottom:0;background:var(--c);z-index:-1;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tab::before{left:0;right:34px;border-radius:10px 0 0 0}
.tab::after{right:0;width:52px;border-radius:0 12px 0 0;transform:skewX(25deg);transform-origin:100% 100%}
.tab:hover::before,.tab:hover::after{filter:brightness(1.08)}
.tab[aria-selected=true]{font-weight:600;padding-top:calc(16px + var(--i)*3px)}
.cover{--c:#FFC62E;background:var(--c);background:radial-gradient(120% 90% at 60% 35%,color-mix(in srgb,var(--c) 82%,#fff),var(--c) 75%);border:1px solid color-mix(in srgb,var(--c) 65%,#000);border-radius:0 12px 12px 12px;padding:22px 22px 18px;position:relative;box-shadow:0 22px 34px -18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.paper{background:var(--paper);color:var(--ink);border-radius:3px;padding:clamp(20px,5vw,44px);min-height:440px;box-shadow:0 4px 0 -1px var(--s1),0 8px 0 -2px var(--s2);margin-bottom:10px}
.label{margin:18px auto 0;width:max-content;max-width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--rule);padding:6px 16px;font-family:'Young Serif',Georgia,serif;font-size:14px;text-align:center;border-radius:2px;transform:rotate(-.6deg)}
.label span{color:var(--muted);font-family:'Instrument Sans',system-ui,sans-serif;margin-left:8px}
h1{font:400 clamp(34px,7vw,56px)/1.05 'Young Serif',Georgia,serif;margin:0}
h3{font:400 22px/1.25 'Young Serif',Georgia,serif;margin:0}
.k-title{font-size:20px;color:var(--accent);margin:.35em 0 1.1em}
.pf{display:flex;gap:32px;align-items:flex-start}
.pf-body{flex:1;min-width:0}
.photo{flex:none;width:170px}
.frame{aspect-ratio:3/4;background:var(--s1);border:6px solid #f7f4ea;border-radius:4px;overflow:hidden;box-shadow:0 2px 0 var(--rule),0 8px 18px -8px rgba(0,0,0,.45);transform:rotate(-1.5deg)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.pho{width:100%;height:100%;font:inherit;font-weight:500;color:var(--ink);background:transparent;border:2px dashed var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.pho:hover{background:var(--s2)}
.pho small{color:var(--muted);font-weight:400}
.pact{display:flex;gap:6px;margin-top:14px;justify-content:center}
@media (max-width:560px){.pf{flex-direction:column;gap:20px}.photo{width:150px}}
.k-text{max-width:64ch;font-size:17px;line-height:1.65;margin:6px 0}
.k-sub{font-weight:600;margin-top:2px}
.metas{display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--muted);font-size:14.5px;margin:2px 0 8px}
.list{margin:.4em 0 0;padding-left:1.2em;max-width:70ch}
.list li{margin:.25em 0}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:8px 0 0}
.chips li{background:var(--s1);border:1px solid var(--rule);border-radius:999px;padding:3px 13px;font-size:15px}
a{color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(80px,120px) 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.row b{font-weight:600;color:var(--muted)}
.entry{padding:18px 0;border-bottom:1px dashed var(--rule);position:relative}
.entry:first-child{padding-top:4px}
.empty{color:var(--muted)}
.f{word-break:break-word}
.ml{white-space:pre-wrap}
.edit .f{outline:1px dashed var(--rule);outline-offset:3px;border-radius:2px;cursor:text;min-width:4ch;min-height:1.4em}
.edit .f:hover{outline-color:var(--muted)}
.edit .f:focus{outline:2px solid var(--focus);background:rgba(74,155,224,.09)}
.edit .k-meta{display:inline-block;min-width:9ch}
.f:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75;pointer-events:none}
.ghost{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.rm{position:absolute;top:14px;right:0}
.entry:first-child .rm{top:0}
.add{margin-top:20px;font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1.5px dashed var(--muted);border-radius:8px;padding:10px 18px;cursor:pointer}
.add:hover{background:var(--s1)}
.sub-h{font:400 18px 'Young Serif',Georgia,serif;margin:30px 0 4px}
.bk{display:none;margin-bottom:16px;background:rgba(255,255,255,.07);border-radius:10px;padding:14px}
.bk.open{display:block}
.bk p{margin:0 0 8px;font-size:14px;color:var(--barm)}
.bk textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px}
.bk div{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#msg{font-size:13px;color:var(--barm)}
@media (max-width:560px){.cover{padding:14px 10px 12px}.row{grid-template-columns:1fr;gap:2px}}
</style>

function field(path,f,val){
 const [key,ph,kind,lab]=f,tag=TAG[kind],ml=kind==='text'||kind==='list'||kind==='chips';
 if(edit){
  const el=`<${tag} class="f k-${kind}${ml?' ml':''}" contenteditable="${CE}" role="textbox" aria-label="${esc(ph)}" data-p="${path}" data-ph="${esc(ph)}" data-ml="${ml?1:0}">${esc(val)}</${tag}>`;
  return kind==='row'?`<div class="row"><b>${lab}</b>${el}</div>`:el;
 }
 if(!val.trim())return '';

 let h=sec.obj?body(sec,D[sec.id]):list(sec);
 if(cur==='profile'){const ph=photo();if(ph)h=`<div class="pf">${ph}<div class="pf-body">${h}</div></div>`}
 if(cur==='contact'){const hasLinks=D.links.length||edit;h+=hasLinks?`<h2 class="sub-h">Links</h2>`+list(LINKS):''}
 p.innerHTML=h;
 $('#mode').textContent=edit?'Preview':'Edit';$('#mode').classList.toggle('on',edit);
 $('#hint').textContent=edit?'Edit mode: click any text to change it.':'Preview: this is how visitors see your folder.';
 label();
}
function photo(){
 const u=D.profile.photo||'';
 if(!u&&!edit)return '';
 const fr=u?`<img src="${esc(u)}" alt="Photo of ${esc(D.profile.name)}">`:`<button class="pho" data-act="photo">Add your photo<small>Click to upload</small></button>`;
 return `<div class="photo"><div class="frame">${fr}</div>${edit&&u?'<div class="pact"><button class="ghost" data-act="photo">Change</button><button class="ghost" data-act="rmphoto">Remove</button></div>':''}</div>`;
}
function label(){const n=D.profile.name.trim()||'Your name',t=D.profile.title.trim();$('#label').innerHTML=esc(n)+(t?`<span>${esc(t)}</span>`:'')}
function setPath(p,v){const a=p.split('|');let o=D[a[0]];for(let i=1;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
const msg=t=>{$('#msg').textContent=t;setTimeout(()=>{$('#msg').textContent=''},3500)};
function arm(btn,txt,fn){if(btn.dataset.armed){fn();return}const old=btn.textContent;btn.dataset.armed=1;btn.textContent=txt;setTimeout(()=>{delete btn.dataset.armed;btn.textContent=old},3000)}

document.addEventListener('input',e=>{
 const el=e.target.closest&&e.target.closest('.f');if(!el)return;
 if(!el.innerText.trim())el.textContent='';
 setPath(el.dataset.p,el.innerText.replace(/\u00a0/g,' '));
 if(el.dataset.p.startsWith('profile|'))label();
 save();
});
document.addEventListener('keydown',e=>{
 const el=e.target.closest&&e.target.closest('.f');
 if(el&&e.key==='Enter'&&el.dataset.ml==='0')e.preventDefault();
 const t=e.target.closest&&e.target.closest('.tab');
 if(t&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
  const V=vis(),i=V.findIndex(s=>s.id===cur),n=V[(i+(e.key==='ArrowRight'?1:V.length-1))%V.length];
  cur=n.id;render();$('#t-'+cur).focus();
 }
});
document.addEventListener('paste',e=>{
 const el=e.target.closest&&e.target.closest('.f');if(!el)return;
 e.preventDefault();let t=(e.clipboardData||window.clipboardData).getData('text/plain');
 if(el.dataset.ml==='0')t=t.replace(/\s*\n\s*/g,' ');
 document.execCommand('insertText',false,t);
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act;
 if(a==='tab'){cur=b.dataset.id;render()}
 else if(a==='mode'){edit=!edit;render()}
 else if(a==='photo'){$('#file').click()}
 else if(a==='rmphoto'){D.profile.photo='';save();render()}
 else if(a==='add'){const s=ALL.find(x=>x.id===b.dataset.s);D[s.id].push(blank(s));save();render();const f=document.querySelector(`[data-p^="${s.id}|${D[s.id].length-1}|"]`);if(f)f.focus()}
 else if(a==='rm'){arm(b,'Click again to remove',()=>{D[b.dataset.s].splice(+b.dataset.i,1);save();render()})}
 else if(a==='bk'){const o=$('#bk').classList.toggle('open');if(o)$('#ta').value=JSON.stringify(D,null,1)}
 else if(a==='copy'){const ta=$('#ta');ta.value=JSON.stringify(D,null,1);(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>msg('Copied.')).catch(()=>{ta.select();try{document.execCommand('copy');msg('Copied.')}catch(x){msg('Select the text and copy it manually.')}})}
 else if(a==='load'){try{const x=JSON.parse($('#ta').value);if(!x||typeof x!=='object')throw 0;D=merge(x);save();render();msg('Loaded.')}catch(x){msg('That text isn’t valid resume data.')}}
 else if(a==='reset'){arm(b,'Click again to restore',()=>{D=structuredClone(DEF);save();render();$('#ta').value=JSON.stringify(D,null,1);msg('Reset.')})}
});
$('#file').addEventListener('change',e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const fail=()=>{$('#hint').textContent='That file couldn’t be read as an image. Try a JPG or PNG.'};
 const r=new FileReader();
 r.onerror=fail;
 r.onload=()=>{const im=new Image();im.onerror=fail;im.onload=()=>{
  try{const W=360,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
   const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;
   c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);
   D.profile.photo=c.toDataURL('image/jpeg',.85);save();render();
  }catch(x){fail()}
 };im.src=r.result};
 r.readAsDataURL(f);
});
if(!OWNER){$('.bar').style.display='none';$('#bk').remove()}
render();
</script>
</body>
</html>
